/* 強制佔滿螢幕，僅留出底部 75px 導航欄 */
.iframe-fullscreen-fix {
    position: fixed;
    top: 0;
    left: 50%; /* 配合 max-width 450px 置中 */
    transform: translateX(-50%);
    width: 100%;
    max-width: 450px; /* 務必與您的 #app 寬度一致 */
    /* 核心計算：總高度 - 導航欄 - 安全區域 */
    height: calc(100dvh - 75px - var(--safe-bottom)); 
    background: white;
    z-index: 49; /* 低於底部導航欄(50)，高於其他內容 */
    overflow: hidden;
    -webkit-overflow-scrolling: touch;
}

.iframe-fullscreen-fix iframe {
    width: 100%;
    height: 100%;
    border: none;
    /* 修正 iOS 切割感 */
    display: block;

<body>
<div id="app">

   <!-- 登入頁 -->
    <div v-if="currPage === 'login'" class="flex-1 flex flex-col justify-center p-6 fade-in relative" :style="{ paddingTop: 'var(--safe-top)' }">
        <div class="login-card rounded-[32px] w-full mx-auto max-w-[360px]">
            <div class="siren-bar"><div class="siren-red"></div><div class="siren-blue"></div></div>
            <div class="p-10 pt-16 pb-12">
                <div class="login-title-box border-l-4 border-blue-500 pl-4 mb-10">
                    <h1 class="text-3xl font-black tracking-tight text-slate-800">EMS PLATFORM</h1>
                    <p class="text-[15px] text-slate-500 font-bold mt-1 tracking-wider">救護義消協勤平台</p>
                </div>
               
                <!-- 狀態 1：LINE 登入中 -->
                <div v-if="authLoading" class="text-center py-8">
                    <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
                    <p class="text-sm font-black text-slate-500">LINE 登入中...</p>
                </div>

                <!-- 狀態 2：帳號已停用 -->
                <div v-cloak v-else-if="binding && binding.status === 'suspended'" class="bg-rose-50 border border-rose-200 rounded-2xl p-6 text-center">
                    <i class="fa-solid fa-user-lock text-3xl text-rose-400 mb-3"></i>
                    <p class="text-sm font-black text-rose-600">{{ binding.name }} 的帳號已停用</p>
                    <p class="text-[11px] font-bold text-rose-400 mt-2">請聯絡分隊幹部</p>
                </div>

                <!-- 狀態 3：第一次使用，綁定隊員身分 -->
                <div v-cloak v-else-if="binding && binding.status === 'unbound'" class="space-y-3 text-left">
                    <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100 mb-2 flex items-center gap-3">
                        <img v-if="lineProfileRef?.picture" :src="lineProfileRef.picture" class="w-9 h-9 rounded-full" alt="">
                        <div><p class="text-[10px] font-black text-emerald-600">已用 LINE 登入</p><p class="text-xs font-bold text-slate-700">{{ lineProfileRef?.name }}</p></div>
                    </div>
                    <p class="text-xs font-black text-rose-500"><i class="fa-solid fa-circle-exclamation mr-1"></i>第一次使用，請綁定你的隊員身分</p>

                    <div class="relative flex items-center">
                        <i class="fa-solid fa-people-group absolute left-4 text-slate-400 z-20"></i>

                let targets = [];
                if (pushTargetMode.value === 'all') {
                    targets = subscribableMembers.value;
                } else {

    if (mohwRecordData.value && mohwRecordData.value.basic_info && mohwRecordData.value.basic_info['證書有效期間']) {

        const parts = dateStr.split('至');
        if (parts.length > 1) {
            const endDateStr = parts[1].trim(); 
            // 用正則表達式把 年、月、日 抓出來
            const match = endDateStr.match(/(\d+)年(\d+)月(\d+)日/);

                const y = parseInt(match[1]) + 1911; // 民國轉西元
                const m = match[2].padStart(2, '0');
                const d = match[3].padStart(2, '0');
                return `${y}/${m}/${d}`; // 組合成 2029/08/18 格式
            }
        }
    }
    // 如果爬蟲還沒抓到資料，先退回使用系統內手動設定的日期

                members.value.forEach(m => {
                    result[m.姓名] = { total: 0, months: {} };
                    for (let i = 1; i <= 12; i++) {
                        result[m.姓名].months[i] = 0;
                    }
                });

                // 2. 計算時數的輔助函式 (例如 08:00 到 20:00 -> 12小時)
                const calcHours = (start, end) => {
                    if (!start || !end || !start.includes(':') || !end.includes(':')) return 0;
                    const [h1, m1] = start.split(':').map(Number);
                    const [h2, m2] = end.split(':').map(Number);
                    return ((h2 * 60 + m2) - (h1 * 60 + m1)) / 60;
                };

                // 3. 遍歷所有協勤紀錄進行累加
                allAssistanceRecords.value.forEach(record => {

                    if (result[record.userName]) {
                        result[record.userName].months[monthInt] += hours;
                        result[record.userName].total += hours;
                    }
                });

                return result;
            });

                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];

                // 🌟 1. 依照您截圖的精準順序定義陣列
                const EXPORT_NAME_ORDER = members.value.map(m => m.姓名); // 依資料庫 sort_order

                const exportSortedMembers = [...members.value].sort((a, b) => {
                    const idxA = EXPORT_NAME_ORDER.indexOf(a.姓名);
                    const idxB = EXPORT_NAME_ORDER.indexOf(b.姓名);
                    return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
                });

                // 2. 初始化資料結構
                const reportData = {};
                const dailyColSums = Array(daysInMonth + 1).fill(0);
                const dailyHeadcounts = Array(daysInMonth + 1).fill(0);
                let grandTotalHours = 0; 

                exportSortedMembers.forEach(member => {
                    reportData[member.姓名] = {
                        title: member.duty_title || '隊員',
                        hoursArray: Array(daysInMonth + 1).fill(0),
                        totalHours: 0
                    };
                });

                const calcHours = (start, end) => {
                    if (!start || !end || !start.includes(':') || !end.includes(':')) return 0;
                    const [h1, m1] = start.split(':').map(Number);
                    const [h2, m2] = end.split(':').map(Number);
                    return ((h2 * 60 + m2) - (h1 * 60 + m1)) / 60;
                };

                // 3. 處理資料並篩選前 8 小時
                const sortedRecords = [...allAssistanceRecords.value].filter(r => {
                    if(!r.date || !r.userName) return false;
                    const [ry, rm] = r.date.split('-');
                    return ry === assistFilterYear.value && rm === assistFilterMonth.value;
                }).sort((a, b) => {
                    if (a.date !== b.date) return a.date.localeCompare(b.date);
                    return (a.shiftStart || '').localeCompare(b.shiftStart || '');
                });

                sortedRecords.forEach(r => {
                    const day = parseInt(r.date.split('-')[2]);
                    const name = r.userName;
                    
                    if (reportData[name] && reportData[name].totalHours < 8) {
                        let startHour = parseInt(r.shiftStart.split(':')[0]);
                        let endHour = parseInt(r.shiftEnd.split(':')[0]);
                        let currentShiftHours = endHour - startHour;
                        let remainingQuota = 8 - reportData[name].totalHours;
                        
                        if (currentShiftHours > remainingQuota) {
                            currentShiftHours = remainingQuota;
                        }

                        reportData[name].hoursArray[day] += currentShiftHours;
                        reportData[name].totalHours += currentShiftHours;
                        dailyColSums[day] += currentShiftHours;
                        dailyHeadcounts[day] += 1;
                        grandTotalHours += currentShiftHours;
                    }
                });

                const grandTotalMoney = grandTotalHours * 150;

                const toChineseAmount = (num) => {
                    const digits = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
                    const units = ['', '拾', '佰', '仟', '萬', '拾萬', '佰萬', '仟萬', '億'];
                    let str = '';
                    let n = Math.floor(num);
                    if (n === 0) return '零元整';
                    let unitPos = 0;
                    while (n > 0) {
                        let digit = n % 10;
                        if (digit !== 0) str = digits[digit] + units[unitPos] + str;
                        else if (str.charAt(0) !== '零' && str !== '') str = '零' + str;
                        n = Math.floor(n / 10);
                        unitPos++;
                    }
                    return str.replace(/零+$/, '').replace(/零萬/, '萬') + '元整';
                };

                // 4. 準備 Excel 樣式
                const fontBase = "font-family:'標楷體', 'DFKai-SB', serif; font-size: 11pt; text-align: center; vertical-align: middle;";
                const border = "border: 0.5pt solid #000000;";
                const cellStyle = `${fontBase} ${border} height: 18pt; mso-number-format:'\\@'; font-weight: normal;`;
                const yellowBg = "background-color: #ffff00;";
                const grayBgTop = "background-color: #808080;"; // 頂端當天協勤次數深灰底
                const grayBgRow = "background-color: #eaeaea;"; // 🌟 救災整列的淺灰底色
                
                const totalCols = daysInMonth + 7;

                let html = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head>
                <meta charset="utf-8">
                <xml>
                    <x:ExcelWorkbook>
                        <x:ExcelWorksheets>
                            <x:ExcelWorksheet>
                                <x:Name>印領清冊</x:Name>
                                <x:WorksheetOptions>
                                    <x:Print>
                                        <x:ValidPrinterInfo/>
                                        <x:PaperSizeIndex>9</x:PaperSizeIndex>
                                        <x:HorizontalResolution>600</x:HorizontalResolution>
                                        <x:VerticalResolution>600</x:VerticalResolution>
                                    </x:Print>
                                    <x:Selected/>
                                    <x:FitToPage/>
                                    <x:Print><x:FitWidth>1</x:FitWidth><x:FitHeight>1</x:FitHeight></x:Print>
                                    <x:PrintTitleRows>$1:$5</x:PrintTitleRows>
                                    <x:PageSetup>
                                        <x:Layout x:Orientation="Landscape"/>
                                        <x:PageMargins x:Bottom="0.5" x:Left="0.25" x:Right="0.25" x:Top="0.5"/>
                                    </x:PageSetup>
                                </x:WorksheetOptions>
                            </x:ExcelWorksheet>
                        </x:ExcelWorksheets>
                    </x:ExcelWorkbook>
                </xml>
                <style>
                    @page { mso-page-orientation: landscape; }
                    table { border-collapse: collapse; }
                </style>
                </head>
                <body>
                <table>
                    <colgroup>
                        <col width="30">  <!-- 編號 -->
                        <col width="85">  <!-- 職稱 -->
                        <col width="85">  <!-- 姓名 -->
                        <col width="45">  <!-- 日期/星期 -->
                `;

                for (let i = 1; i <= daysInMonth; i++) html += `<col width="36">`; 
                html += `<col width="40"><col width="65"><col width="85"></colgroup><tbody>`;

                // Row 1: 當天協勤次數 (深灰色底)
                html += `<tr style="height: 18pt;">
                    <td colspan="4" style="${fontBase} ${grayBgTop} ${border} font-size: 10pt;">當天協勤<br>次數</td>`;
                for (let i = 1; i <= daysInMonth; i++) {
                    html += `<td style="${fontBase} ${grayBgTop} ${border} font-size: 10pt;">${dailyHeadcounts[i]}</td>`;
                }
                html += `<td colspan="3" style="${border} ${grayBgTop}"></td></tr>`;

                // Row 2: 大標題
                html += `
                    <tr style="height: 35pt;">
                        <td colspan="${totalCols - 1}" style="${fontBase} ${yellowBg} border: none; font-size: 14pt; font-weight: bold;">新北市政府消防局${currentSquadName.value}分隊${minguoYear}年${m}月義消人員協勤及救災費申請印領清冊(每小時150元)</td>
                        <td style="${fontBase} ${yellowBg} border: none; font-size: 9pt; text-align: left; vertical-align: top; padding-top: 5px;">簽收清冊與印領清冊各印一份</td>
                    </tr>
                `;

                // Row 3: 表頭上半部
                html += `
                    <tr>
                        <td rowspan="3" style="${cellStyle} ${yellowBg}">編<br>號</td>
                        <td rowspan="3" style="${cellStyle} ${yellowBg}">職稱</td>
                        <td rowspan="3" style="${cellStyle} ${yellowBg}">姓名</td>
                        <td colspan="${daysInMonth + 1}" style="${cellStyle} ${yellowBg}">協勤日期及時數</td>
                        <td colspan="2" style="${cellStyle} ${yellowBg}">協勤及救<br>災總額</td>
                        <td rowspan="3" style="${cellStyle} ${yellowBg}">領款簽章</td>
                    </tr>
                `;

                // Row 4: 日期 與 時數/金額 切分
                html += `<tr><td style="${cellStyle} ${yellowBg}">日期</td>`;
                for (let i = 1; i <= daysInMonth; i++) {
                    html += `<td style="${cellStyle} ${yellowBg}">${i}</td>`;
                }
                html += `
                    <td rowspan="2" style="${cellStyle} ${yellowBg}">時數</td>
                    <td rowspan="2" style="${cellStyle} ${yellowBg}">領款金<br>額</td>
                </tr>`;

                // Row 5: 星期
                html += `<tr><td style="${cellStyle} ${yellowBg}">星期</td>`;
                for (let i = 1; i <= daysInMonth; i++) {
                    const dateObj = new Date(y, m - 1, i);
                    html += `<td style="${cellStyle} ${yellowBg}">${weekdays[dateObj.getDay()]}</td>`;
                }
                html += `</tr>`;

                // 內容資料
                let rowCount = 1;
                exportSortedMembers.forEach((member) => {
                    const name = member.姓名;
                    const data = reportData[name];
                    const money = data.totalHours * 150;

                    const makeDataCells = (arr) => {
                        let cells = '';
                        for (let i = 1; i <= daysInMonth; i++) {
                            let val = arr[i];
                            cells += `<td style="${cellStyle}">${val > 0 ? val : ''}</td>`;
                        }
                        return cells;
                    };

                    // 🌟 救災格子產生器 (整列套用淺灰底)
                    const makeGrayEmptyCells = () => {
                        let cells = '';
                        for (let i = 1; i <= daysInMonth; i++) {
                            cells += `<td style="${cellStyle} ${grayBgRow}"></td>`;
                        }
                        return cells;
                    };

                    // 第一列：協勤
                    html += `
                    <tr>
                        <td rowspan="2" style="${cellStyle}">${rowCount++}</td>
                        <td rowspan="2" style="${cellStyle}">${data.title}</td>
                        <td rowspan="2" style="${cellStyle}">${name}</td>
                        <td style="${cellStyle} ${yellowBg}">協勤</td>
                        ${makeDataCells(data.hoursArray)}
                        <td style="${cellStyle} ${yellowBg}">${data.totalHours > 0 ? data.totalHours : '0'}</td>
                        <td style="${cellStyle} ${yellowBg}">${money > 0 ? money.toLocaleString() : '0'}</td>
                        <td rowspan="2" style="${cellStyle}"></td>
                    </tr>
                    `;
                    
                    // 🌟 第二列：救災 (從「救災」字眼、1~31天、到最後的時數金額，整條都是灰底)
                    html += `
                    <tr>
                        <td style="${cellStyle} ${grayBgRow}">救災</td>
                        ${makeGrayEmptyCells()}
                        <td style="${cellStyle} ${grayBgRow}">-</td>
                        <td style="${cellStyle} ${grayBgRow}">-</td>
                    </tr>
                    `;
                });

                // 底部統計列
                html += `
                    <tr>
                        <td colspan="4" style="${cellStyle} ${yellowBg}">協勤時數合計(小計)</td>
                `;
                for (let i = 1; i <= daysInMonth; i++) {
                    let sum = dailyColSums[i];
                    html += `<td style="${cellStyle} ${yellowBg}">${sum > 0 ? sum : '0'}</td>`;
                }
                html += `
                        <td style="${cellStyle} ${yellowBg}">${grandTotalHours > 0 ? grandTotalHours : '0'}</td>
                        <td style="${cellStyle} ${yellowBg} text-align: left; padding-left: 2px;">合計:</td>
                        <td style="${cellStyle} ${yellowBg} text-align: right; padding-right: 2px;">${grandTotalMoney.toLocaleString()}</td>
                    </tr>
                    <tr>
                        <td colspan="4" style="${cellStyle} ${yellowBg}">救災時數合計(小計)</td>
                `;
                // 救災小計列維持黃底橫線
                for (let i = 1; i <= daysInMonth; i++) html += `<td style="${cellStyle} ${yellowBg}">-</td>`;
                html += `
                        <td style="${cellStyle} ${yellowBg}">-</td>
                        <td style="${cellStyle} ${yellowBg} text-align: left; padding-left: 2px;">合計:</td>
                        <td style="${cellStyle} ${yellowBg} text-align: right; padding-right: 2px;">-</td>
                    </tr>
                `;

                // 中文大寫總計列
                html += `
                    <tr>
                        <td colspan="${totalCols}" style="${cellStyle} ${yellowBg} text-align: left; padding-left: 10px; font-weight: bold;">總計新臺幣：${toChineseAmount(grandTotalMoney)}</td>
                    </tr>
                `;

                // 簽名列
                const splitCol = Math.floor(totalCols / 3);
                html += `
                    <tr>
                        <td colspan="${splitCol}" style="border: none !important; text-align: left; padding-top: 15px; font-size: 12pt; font-family:'標楷體', serif; font-weight: bold;">承辦人：</td>
                        <td colspan="${splitCol}" style="border: none !important; text-align: center; padding-top: 15px; font-size: 12pt; font-family:'標楷體', serif; font-weight: bold;">義消分隊長：</td>
                        <td colspan="${totalCols - (splitCol * 2)}" style="border: none !important; text-align: left; padding-top: 15px; font-size: 12pt; font-family:'標楷體', serif; font-weight: bold;">分隊主管：</td>
                    </tr>
                `;

                html += `</tbody></table></body></html>`;

                const blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.setAttribute("download", `${currentSquadName.value}義消_${minguoYear}年${m}月_印領清冊.xls`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            
            const rankingFilterYear = ref(new Date().getFullYear().toString());
            const rankingFilterMonth = ref('');
            const rankingType = ref('hours'); 
            const rankingCaseType = ref('急病'); // 個別案件預設選中
            const RANKING_MIN_HOURS = 100; // 個別案件佔比排名：時數門檻
            const RANKING_TOP_CASE_RATIO = 0.3; // 總出勤需在「時數達標隊員」的前 30%

            // 動態計算全隊排行資料
            const teamRankingData = computed(() => {
                const dataMap = {};
                // 初始化名單
                members.value.forEach(m => {
                    dataMap[m.姓名] = {
                        name: m.姓名,
                        title: m.duty_title || '隊員',
                        hours: 0,
                        caseHours: 0,       // 每件案件出勤時間加總 (出勤時數)
                        caseCount: 0,       // 實際跑的救護案件總數 (總出勤)
                        caseTypesCount: {}  // 記錄各種案件的獨立數量
                    };
                });

                const calcHours = (start, end) => {
                    if (!start || !end || !start.includes(':') || !end.includes(':')) return 0;
                    const [h1, m1] = start.split(':').map(Number);
                    const [h2, m2] = end.split(':').map(Number);
                    return ((h2 * 60 + m2) - (h1 * 60 + m1)) / 60;
                };

                // 遍歷紀錄計算
                allAssistanceRecords.value.forEach(record => {
                    if (!record.date || !record.userName) return;
                    const [y, mStr, d] = record.date.split('-');
                    
                    if (rankingFilterYear.value && y !== rankingFilterYear.value) return;
                    if (rankingFilterMonth.value && mStr !== rankingFilterMonth.value) return;

                    if (dataMap[record.userName]) {
                        // 1. 累加時數
                        dataMap[record.userName].hours += calcHours(record.shiftStart, record.shiftEnd);
                        
                        // 2. 累加實際救護案件數(總出勤) 與「特定種類案件數」
                        if (record.cases && record.cases.length > 0) {
                            dataMap[record.userName].caseCount += record.cases.length;
                            record.cases.forEach(c => {
                                // 案件出勤時間（跨午夜時自動加 24 小時）
                                let ch = calcHours(c.caseStart || c.startTime, c.caseEnd || c.endTime);
                                if (ch < 0) ch += 24;
                                if (ch > 0 && ch <= 24) dataMap[record.userName].caseHours += ch;
                                if (c.caseType) {
                                    dataMap[record.userName].caseTypesCount[c.caseType] = (dataMap[record.userName].caseTypesCount[c.caseType] || 0) + 1;
                                }
                            });
                        } else if (record.caseType) { // 相容舊資料
                            dataMap[record.userName].caseCount += 1;
                            dataMap[record.userName].caseTypesCount[record.caseType] = (dataMap[record.userName].caseTypesCount[record.caseType] || 0) + 1;
                        }
                    }
                });

                return Object.values(dataMap).map(item => ({
                    ...item,
                    hours: Number(item.hours.toFixed(1)),
                    caseHours: Number(item.caseHours.toFixed(1))
                }));
            });

            // 個別案件排名的出勤件數門檻：時數達標隊員中，總出勤前 30% 的最低件數（同件數並列者一起列入）
            const rankingMinCases = computed(() => {
                const counts = teamRankingData.value
                    .filter(m => m.hours >= RANKING_MIN_HOURS && m.caseCount > 0)
                    .map(m => m.caseCount)
                    .sort((a, b) => b - a);
                if (counts.length === 0) return 0;
                const topN = Math.max(1, Math.ceil(counts.length * RANKING_TOP_CASE_RATIO));
                return counts[topN - 1];
            });

            // 根據選擇的 rankingType 進行排序過濾，並附加 displayScore 讓畫面直接渲染
            const currentRankingList = computed(() => {
                const list = [...teamRankingData.value];
                
                if (rankingType.value === 'hours') {
                    // 時數排名 (高到低)
                    return list.map(m => ({ ...m, displayScore: m.hours, displayLabel: 'Total Hours' }))
                               .sort((a, b) => b.displayScore - a.displayScore)
                               .filter(m => m.displayScore > 0);
                } else if (rankingType.value === 'case_hours') {
                    // 出勤時數排名 (每件案件出勤時間加總，高到低)
                    return list.map(m => ({ ...m, displayScore: m.caseHours, displayLabel: 'Case Hours' }))
                               .sort((a, b) => b.displayScore - a.displayScore)
                               .filter(m => m.displayScore > 0);
                } else if (rankingType.value === 'total_cases') {
                    // 總出勤案件排名 (高到低)
                    return list.map(m => ({ ...m, displayScore: m.caseCount, displayLabel: 'Total Cases' }))
                               .sort((a, b) => b.displayScore - a.displayScore)
                               .filter(m => m.displayScore > 0);
                } else {
                    // 🌟 個別案件排名：只列出達到門檻的人
                    return singleCaseRows.value.filter(m => m.qualified);
                }
            });

            // 個別案件：每位隊員的佔比與是否達標（排名、未列入排名共用）
            const singleCaseRows = computed(() => {
                const cType = rankingCaseType.value;
                const norm = (k) => String(k).replace(/\s/g, '').replace('：', ':').toUpperCase();
                const puaKey = norm('PUA:' + cType);
                return teamRankingData.value
                    .filter(m => m.hours > 0 || m.caseCount > 0) // 期間內完全沒協勤的不列
                    .map(m => {
                        // 「PUA:X」案件也併入 X 計算（例如 OHCA = OHCA + PUA:OHCA）
                        const baseCount = m.caseTypesCount[cType] || 0;
                        const puaCount = Object.entries(m.caseTypesCount)
                            .filter(([k]) => k !== cType && norm(k) === puaKey)
                            .reduce((sum, [, v]) => sum + v, 0);
                        const specificCaseCount = baseCount + puaCount;
                        // 計算比例：(該類件數 / 總出勤件數) * 100
                        const ratio = m.caseCount > 0 ? (specificCaseCount / m.caseCount) * 100 : 0;
                        // 未列入原因
                        const reasons = [];
                        if (m.hours < RANKING_MIN_HOURS) reasons.push(`協勤未滿 ${RANKING_MIN_HOURS} hr`);
                        if (m.caseCount < rankingMinCases.value) reasons.push(`出勤未達 ${rankingMinCases.value} 件`);
                        if (specificCaseCount === 0) reasons.push(`無 ${cType} 案件`);
                        return {
                            ...m,
                            specificCaseCount,
                            baseCaseCount: baseCount,
                            puaCaseCount: puaCount,
                            displayScore: Number(ratio.toFixed(1)),
                            displayLabel: cType + ' 佔比',
                            qualified: reasons.length === 0,
                            reasons
                        };
                    })
                    .sort((a, b) => b.displayScore - a.displayScore || b.caseCount - a.caseCount);
            });
            const unrankedSingleCaseList = computed(() => singleCaseRows.value.filter(m => !m.qualified));
// ── 「我的紀錄」專用的搜尋與過濾狀態 ──
            const myAssistSearchQuery = ref('');
            const myAssistFilterYear = ref(new Date().getFullYear().toString());
            const myAssistFilterMonth = ref(''); // 預設全部月份

            // 動態過濾我的紀錄
            const filteredMyAssistanceRecords = computed(() => {
                if (!myAssistanceRecords.value) return [];
                return myAssistanceRecords.value.filter(r => {
                    const search = myAssistSearchQuery.value.trim().toLowerCase();
                    
                    // 針對「我的紀錄」，搜尋關鍵字對準：地點、案件種類 (因為名字一定都是自己)
                    const matchSearch = !search || 
                        (r.cases && r.cases.some(c => 
                            (c.address && c.address.toLowerCase().includes(search)) ||
                            (c.caseType && c.caseType.toLowerCase().includes(search))
                        )) ||
                        (r.address && r.address.toLowerCase().includes(search)) || // 兼容舊資料
                        (r.caseType && r.caseType.toLowerCase().includes(search)); // 兼容舊資料

                    const [y, m] = r.date.split('-');
                    const matchYear = !myAssistFilterYear.value || y === myAssistFilterYear.value;
                    const matchMonth = !myAssistFilterMonth.value || m === myAssistFilterMonth.value;
                    
                    return matchSearch && matchYear && matchMonth;
                });
            });


            const filteredAllAssistanceRecords = computed(() => {
                if (!allAssistanceRecords.value) return [];
                return allAssistanceRecords.value.filter(r => {
                    const search = assistSearchQuery.value.trim().toLowerCase();
                    const matchSearch = !search || r.userName.toLowerCase().includes(search) || (r.cases && r.cases.some(c => c.address.toLowerCase().includes(search)));
                    const [y, m] = r.date.split('-');
                    const matchYear = !assistFilterYear.value || y === assistFilterYear.value;
                    const matchMonth = !assistFilterMonth.value || m === assistFilterMonth.value;
                    return matchSearch && matchYear && matchMonth;
                });

const timeToMin = (t) => {
    if (!t || !t.includes(':')) return -1;
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
};

// 核心驗證函式
const validateAssistanceForm = (form) => {
    if (!form || !form.cases) return true;
    
    const shiftStartMin = timeToMin(form.startTime || form.shiftStart);
    const shiftEndMin = timeToMin(form.endTime || form.shiftEnd);
    let allValid = true;

    form.cases.forEach((c, idx) => {
        c.errStart = false; 
        c.errEnd = false; 
        c.errMsg = '';

        const cStartStr = c.startTime || c.caseStart;
        const cEndStr = c.endTime || c.caseEnd;
        
        const cStart = timeToMin(cStartStr);
        const cEnd = timeToMin(cEndStr);
        
        // 🌟 嚴格擋下格式不對的時間 (沒有冒號或轉換失敗)
        if (cStart === -1) {
            c.errStart = true;
            c.errMsg = '請輸入完整的 4 碼時間 (如 0900)';
            allValid = false;
        }
        if (cEnd === -1) {
            c.errEnd = true;
            if (!c.errMsg) c.errMsg = '請輸入完整的 4 碼時間 (如 0900)';
            allValid = false;
        }
        
        if (cStart === -1 || cEnd === -1) return; // 格式不對就直接跳過比大小

        if (cStart >= cEnd) {
            c.errEnd = true; 
            c.errMsg = '開始時間必須「小於」結束時間';
            allValid = false;
        }

        if (idx === 0 && cStart < shiftStartMin) {
            c.errStart = true; 
            c.errMsg = `首件需晚於協勤開始 (${form.startTime || form.shiftStart})`;
            allValid = false;
        }

        if (idx > 0) {
            const prevCase = form.cases[idx - 1];
            const prevEndStr = prevCase.endTime || prevCase.caseEnd;
            const prevEndMin = timeToMin(prevEndStr);
            
            if (prevEndMin !== -1 && cStart < prevEndMin) {
                c.errStart = true; 
                c.errMsg = `時間重疊！需晚於前件結束 (${prevEndStr})`;
                allValid = false;
            }
        }

        if (idx === form.cases.length - 1 && cEnd > shiftEndMin) {
            c.errEnd = true; 
            c.errMsg = `末件需早於協勤結束 (${form.endTime || form.shiftEnd})`;
            allValid = false;
        }
    });
    
    return allValid;
};

// 處理數字轉時間格式 (如 1230 -> 12:30)
const handleTimeInput = (item, field, formType) => {
    let val = item[field];
    if (!val) {
        const targetForm = formType === 'edit' ? editingAssistRecord.value : assistanceForm.value;
        validateAssistanceForm(targetForm);
        return;
    }

    // 🌟 如果已經是帶有冒號的正確格式，直接驗證並跳出
    if (val.includes(':') && val.length === 5) {
        const targetForm = formType === 'edit' ? editingAssistRecord.value : assistanceForm.value;
        validateAssistanceForm(targetForm);
        return;
    }

    val = val.replace(/\D/g, ''); 
    if (val.length > 4) val = val.substring(0, 4);
    if (val.length === 3) val = '0' + val; // 輸入 3 碼自動補 0，如 900 -> 0900
    
    if (val.length === 4) {
        const h = parseInt(val.substring(0, 2));
        const m = parseInt(val.substring(2, 4));
        
        const isValidTime = (h >= 0 && h <= 23 && m >= 0 && m <= 59) || (h === 24 && m === 0);
        
        if (isValidTime) {
            item[field] = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            item.errMsg = '';
        } else {
            item.errMsg = '時間格式錯誤 (最高 24:00)';
            item[field] = ''; 
        }
    } else {
        // 🌟 核心修改：長度不對，直接報錯並清空
        item.errMsg = '請輸入 4 碼時間 (如 0900)';
        item[field] = '';
    }
    
    const targetForm = formType === 'edit' ? editingAssistRecord.value : assistanceForm.value;
    validateAssistanceForm(targetForm);
};
